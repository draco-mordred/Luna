name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        # npm install (not ci) so the lock file is reconciled in CI
        # until package-lock.json is regenerated and committed locally.
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: CI=false npx react-scripts build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luna-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
